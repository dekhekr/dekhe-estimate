<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>DEKHE 견적서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 작성 화면은 좌측 입력 + 우측 고정 합계 요약, 출력 화면은 A4 용지를 그대로 쌓아 보여준다 */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --ink:#1e1f22; --muted:#6a6c71; --line:#dbdbd8; --soft:#ececea;
  --btn:#1e1f22; --btn-ink:#ffffff; --danger:#b3261e; --paper:#ffffff; --paper-ink:#1e1f22; --paper-muted:#6a6c71; --paper-line:#cfcfcc;
  --display:"Inter Tight","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR","Inter Tight",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#161719; --surface:#202124; --ink:#ececea; --muted:#a2a4a8; --line:#37393d; --soft:#2a2c30; --btn:#ececea; --btn-ink:#161719; --danger:#f2867f; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#161719; --surface:#202124; --ink:#ececea; --muted:#a2a4a8; --line:#37393d; --soft:#2a2c30; --btn:#ececea; --btn-ink:#161719; --danger:#f2867f; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand small{font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted);margin-left:8px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
nav a.on{background:var(--btn);color:var(--btn-ink)}
h1{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:22px 16px}
.head .sp{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-weight:500}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:5px 7px}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:38px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.muted{color:var(--muted)} .small{font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:middle}
/* 목록 */
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;min-width:640px}
table.list th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td.act{white-space:nowrap;text-align:right}
/* 작성 */
.edit{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.edit{grid-template-columns:minmax(0,1fr)}.aside{position:static}}
details.cat{border-top:1px solid var(--line)} details.cat:last-of-type{border-bottom:1px solid var(--line)}
details.cat summary{cursor:pointer;padding:10px 2px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px}
.chips button{border-radius:999px;padding:5px 11px;font-size:13px}
.row{display:grid;gap:6px;grid-template-columns:150px minmax(0,1fr) 64px 78px 120px 116px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.row .wide{grid-column:1/-1;display:grid;gap:6px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;align-items:start}
.row output{padding:7px 2px;font-weight:700}
.row .acts{display:flex;gap:0;white-space:nowrap}
@media (max-width:760px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}.row .wide{grid-template-columns:minmax(0,1fr)}.row .c-name{grid-column:1/-1}}
.sum dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .total{border-top:1px solid var(--ink);padding-top:12px;margin-top:6px}
.sum .total b{font-family:var(--display);font-size:28px;letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}
.sum hr{border:0;border-top:1px solid var(--line);margin:4px 0;grid-column:1/-1;width:100%}
.inline{display:flex;gap:6px;align-items:end} .inline > *{min-width:0}
/* 항목 관리 */
.tpl{display:grid;gap:6px;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) 84px 120px auto;padding:6px 0;align-items:center}
@media (max-width:760px){.tpl{grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);padding:10px 0}}
/* A4 용지 */
#stage{overflow:hidden}
#scale{transform-origin:top left;width:794px}
.sheet{width:794px;height:1123px;background:var(--paper);color:var(--paper-ink);padding:52px 56px 0;display:flex;flex-direction:column;margin-bottom:18px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);font-size:11.5px;line-height:1.5}
.sbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sfoot{flex:none;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--paper-ink);padding:9px 0 26px;font-size:9.5px;color:var(--paper-muted)}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.s-contact{font-size:10px;color:var(--paper-muted);line-height:1.7}
.s-title{font-family:var(--display);font-weight:700;font-size:50px;line-height:.95;letter-spacing:-.04em;text-align:right}
.s-title small{display:block;font-size:10px;letter-spacing:.16em;font-weight:600;color:var(--paper-muted);margin-top:8px}
.s-meta{display:flex;justify-content:space-between;gap:20px;margin-top:34px;padding-bottom:10px;border-bottom:1px solid var(--paper-ink)}
.s-meta b{display:block;font-size:14px}
.s-meta .r{text-align:right}
.s-kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 14px;padding:10px 0 4px}
.s-kv span{display:block;font-size:9px;letter-spacing:.08em;color:var(--paper-muted)}
.s-amount{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 16px}
.s-amount b{font-family:var(--display);font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
table.q{width:100%;border-collapse:collapse;table-layout:fixed}
table.q th{font-size:9px;letter-spacing:.08em;font-weight:600;color:var(--paper-muted);text-align:left;padding:6px 6px 6px 0;border-top:1px solid var(--paper-ink);border-bottom:1px solid var(--paper-line)}
table.q td{padding:7px 6px 7px 0;border-bottom:1px solid var(--paper-line);vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
table.q th:last-child,table.q td:last-child{padding-left:12px}
table.q .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.q .d{color:var(--paper-muted);white-space:pre-line;font-size:10.5px}
table.q tr.cat td{font-weight:700;padding-top:12px;border-bottom:1px solid var(--paper-ink)}
table.q tr.sub td{font-weight:700;border-bottom:0;padding-bottom:4px}
.s-tot{align-self:flex-end;width:300px;margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.s-tot .g{border-top:1px solid var(--paper-ink);padding-top:7px;margin-top:4px;font-weight:700;font-size:14px}
.s-tot div:nth-child(even){text-align:right}
.s-terms{margin-top:18px} .s-terms h3{font-size:9px;letter-spacing:.08em;color:var(--paper-muted);margin:0 0 2px;font-weight:600}
.s-term{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:5px 0;border-top:1px solid var(--paper-line);white-space:pre-line}
.s-term b{font-weight:500}
.s-mark{margin-top:auto;padding:18px 0 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:9px 16px;border-radius:999px;font-weight:500;max-width:calc(100% - 32px);z-index:20}
#shot{position:fixed;left:-12000px;top:0;width:794px}
#shot .sheet{box-shadow:none;margin:0}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .top,.head,#toast,.noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  #stage{height:auto!important;overflow:visible}
  #scale{transform:none!important}
  .sheet{box-shadow:none;margin:0;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){button,nav a{transition:background-color .12s}}
</style>

</head>

function newQuote(){const d=today();const n=(state?state.quotes.length:0)+1;
  return {id:uid(),title:"견적서",no:"DK-"+d.replace(/-/g,"")+"-"+String(n).padStart(2,"0"),date:d,validDays:30,project:"",client:{name:"",person:"",tel:"",email:""},period:"",due:"",rows:[],vatMode:"excl",vatRate:10,discount:0,roundUnit:1,roundMode:"round",terms:{},updated:Date.now()}}
function exampleQuote(){const q=newQuote();Object.assign(q,{project:"(예시) 기관 웹사이트 개편 및 SNS 운영",client:{name:"예시 고객사",person:"홍길동 담당",tel:"",email:""},period:"계약일로부터 8주",due:""});
  const r=(cat,name,desc,qty,unit,price,note)=>q.rows.push({id:uid(),cat,name,desc,qty,unit,price,note:note||""});
  r(CATS[0],"요구사항 정리 및 사이트 구조 기획","메뉴 구조, 화면설계서",1,"식",1500000);
  r(CATS[0],"메인 페이지 디자인","시안 2안 제시 후 1안 선택",1,"페이지",1200000,"수정 2회");
  r(CATS[0],"서브 페이지 디자인","템플릿 기준",6,"페이지",300000);
  r(CATS[1],"메인 페이지 구축","반응형",1,"페이지",800000);
  r(CATS[1],"서브 페이지 구축","",6,"페이지",250000);

  r(CATS[5],"도메인·호스팅","1년",1,"식",270000,"실비");

  return q}
let state=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.quotes)&&Array.isArray(s.templates))return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
let saveT;function touch(){const q=cur();if(q)q.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(save,300)}
state=load();
if(!state){state={supplier:{name:"DEKHE",ceo:"",bizno:"",addr:"",tel:"",email:""},templates:[],quotes:[],currentId:null};state.templates=seedTemplates();const q=exampleQuote();state.quotes.push(q);state.currentId=q.id}
function cur(){return state.quotes.find(q=>q.id===state.currentId)||state.quotes[0]||null}

function calc(q){const subs={};let sub=0;q.rows.forEach(r=>{const a=Math.round((Number(r.qty)||0)*(Number(r.price)||0));subs[r.cat]=(subs[r.cat]||0)+a;sub+=a});
  const u=Number(q.roundUnit)||1,rate=(Number(q.vatRate)||0)/100,disc=Number(q.discount)||0,base=sub-disc;
  const rnd=x=>(q.roundMode==="floor"?Math.floor(x/u+1e-9):Math.round(x/u))*u;
  let supply,vat,total;
  if(q.vatMode==="excl"){supply=base;total=rnd(base*(1+rate));vat=total-supply}
  else if(q.vatMode==="incl"){total=rnd(base);supply=Math.round(total/(1+rate));vat=total-supply}
  else{total=rnd(base);supply=total;vat=0}
  return {subs,sub,disc,base,supply,vat,total}}
const vatLabel=q=>q.vatMode==="excl"?"부가세 별도":q.vatMode==="incl"?"부가세 포함":"부가세 미적용";

let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
async function saveFile(filename,data){
  if(inClaude){const dl=await window.claude.use("downloads");if(!dl){toast("이 화면에서는 파일 저장을 쓸 수 없습니다");return false}
    try{await dl.save({filename,data});return true}catch(e){toast(e&&e.code==="declined"?"저장을 취소했습니다":"파일을 저장하지 못했습니다");return false}}
  const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}

/* ---------- 화면 전환 ---------- */
const VIEWS=["list","edit","items","preview"];
function route(){let v=location.hash.replace("#","");if(!VIEWS.includes(v))v="edit";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  ({list:renderList,edit:renderEdit,items:renderItems,preview:renderPreview})[v]();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
function go(v){if(location.hash==="#"+v)route();else location.hash=v}

/* ---------- 목록 ---------- */
let search="";
function renderList(){
  $("#view").innerHTML=`<div class="head"><h1>견적서 목록</h1><div class="sp">
    <button id="bExport">데이터 내보내기</button><button id="bImport">가져오기</button><button class="primary" id="bNew">새 견적서</button></div></div>
  <div class="panel stack"><input id="listSearch" type="search" placeholder="프로젝트명, 고객사, 견적 번호로 검색" value="${esc(search)}" aria-label="견적서 검색">
  <div class="tablewrap"><table class="list"><thead><tr><th>프로젝트 / 견적 번호</th><th>고객사</th><th>작성일</th><th class="num">합계</th><th></th></tr></thead><tbody id="listBody"></tbody></table></div></div>`;
  drawList();
  $("#listSearch").addEventListener("input",e=>{search=e.target.value;drawList()});
  $("#bNew").onclick=()=>{const q=newQuote();state.quotes.unshift(q);state.currentId=q.id;save();go("edit")};
  $("#bExport").onclick=async()=>{if(await saveFile("dekhe-estimate-data-"+today()+".json",JSON.stringify(state,null,2)))toast("데이터 파일을 내보냈습니다")};
  $("#bImport").onclick=()=>$("#importFile").click();
}
function drawList(){const k=search.trim().toLowerCase();
  const rows=state.quotes.filter(q=>!k||[q.project,q.client.name,q.no,q.title].join(" ").toLowerCase().includes(k));
  $("#listBody").innerHTML=rows.length?rows.map(q=>`<tr><td><b>${esc(q.project||"(프로젝트명 없음)")}</b><div class="muted small">${esc(q.no)}</div></td><td>${esc(q.client.name)}</td><td>${esc(q.date)}</td><td class="num">${won(calc(q).total)}원</td>
    <td class="act"><button data-act="open" data-id="${q.id}">편집</button> <button data-act="dup" data-id="${q.id}">복제</button> <button class="danger" data-act="del" data-id="${q.id}">삭제</button></td></tr>`).join("")
    :`<tr><td colspan="5" class="muted">${state.quotes.length?"검색 결과가 없습니다.":"저장된 견적서가 없습니다. ‘새 견적서’로 시작하세요."}</td></tr>`}
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const s=JSON.parse(fr.result);if(!Array.isArray(s.quotes)||!Array.isArray(s.templates))throw 0;state=s;state.supplier=state.supplier||{};save();toast("데이터를 가져왔습니다");route()}catch(err){toast("가져올 수 없는 파일입니다. 내보낸 JSON 파일을 선택하세요")}};
  fr.readAsText(f);e.target.value=""});

const sel=(opts,v)=>opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("");
function fld(label,bind,val,type,ph){return `<label>${label}<input id="f-${bind.replace(/\./g,"-")}" data-bind="${bind}" type="${type||"text"}" value="${esc(val)}" placeholder="${esc(ph||"")}"></label>`}
function rowHTML(r){return `<div class="row" data-row="${r.id}">
  <select id="r-${r.id}-cat" data-f="cat" aria-label="대분류">${sel(CATS,r.cat)}</select>

let armed=null;
function confirmClick(btn,fn){if(armed===btn){armed=null;fn();return}armed=btn;const old=btn.textContent;btn.textContent="한 번 더 누르면 삭제";setTimeout(()=>{if(armed===btn){armed=null;btn.textContent=old}},3000)}
$("#view").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const q=cur();

    drawRows();drawSum();touch()}
  else if(b.dataset.act){const id=b.dataset.id,i=state.quotes.findIndex(x=>x.id===id);if(i<0)return;

    else if(b.dataset.act==="del"){confirmClick(b,()=>{state.quotes.splice(i,1);if(state.currentId===id)state.currentId=state.quotes[0]?state.quotes[0].id:null;save();drawList();toast("삭제했습니다")})}}
  else if(b.dataset.ta){const el=b.closest("[data-tpl]");

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function buildSheets(host){const q=cur(),s=state.supplier,c=calc(q);host.innerHTML="";const sheets=[];let page,body,tbody;
  const foot=()=>`<span>${esc([s.name,s.addr].filter(Boolean).join(" · "))}</span><span>${esc([s.tel,s.email].filter(Boolean).join(" · "))} <span class="pg"></span></span>`;
  function newSheet(){page=el("div","sheet");body=el("div","sbody");page.append(body,el("div","sfoot",foot()));host.append(page);sheets.push(page);tbody=null}
  const over=()=>body.scrollHeight>body.clientHeight+1;
  function add(e){body.append(e);if(over()&&body.children.length>1){e.remove();newSheet();body.append(e)}}
  function newTable(){const t=el("table","q",`<colgroup><col style="width:44%"><col style="width:8%"><col style="width:8%"><col style="width:14%"><col style="width:14%"><col style="width:12%"></colgroup><thead><tr><th>항목 / 세부 내용</th><th class="n">수량</th><th>단위</th><th class="n">단가</th><th class="n">금액</th><th>비고</th></tr></thead><tbody></tbody>`);
    add(t);tbody=t.querySelector("tbody")}
  function addRow(html,cls){const tr=el("tr",cls,html);if(!tbody)newTable();tbody.append(tr);
    if(over()){tr.remove();if(!tbody.children.length)tbody.closest("table").remove();newSheet();newTable();tbody.append(tr)}}
  newSheet();
  const valid=q.validDays?`작성일로부터 ${esc(q.validDays)}일`:"-";
  add(el("div","",`<div class="s-top"><div class="s-contact"><img src="data:image/png;base64,${LOGO}" alt="${esc(s.name||"DEKHE")}" style="display:block;width:150px;height:auto;margin-bottom:8px">${[s.ceo&&"대표 "+s.ceo,s.bizno&&"사업자등록번호 "+s.bizno,s.tel,s.email].filter(Boolean).map(esc).join("<br>")}</div>
    <div class="s-title">${esc(q.title||"견적서")}<small>ESTIMATE</small></div></div>
    <div class="s-meta"><div><span class="s-contact">프로젝트</span><b>${esc(q.project||"-")}</b></div><div class="r"><span class="s-contact">${esc([q.client.person,q.client.tel,q.client.email].filter(Boolean).join(" · "))||"&nbsp;"}</span><b>${esc(q.client.name||"고객사")} 귀하</b></div></div>
    <div class="s-kv"><div><span>견적 번호</span>${esc(q.no||"-")}</div><div><span>작성일</span>${esc(q.date||"-")}</div><div><span>유효기간</span>${valid}</div><div><span>작업 기간 / 납품 예정일</span>${esc([q.period,q.due].filter(Boolean).join(" / ")||"-")}</div></div>
    <div class="s-amount"><span>합계 금액 (${vatLabel(q)})</span><b>₩ ${won(c.total)}</b></div>`));
  CATS.filter(k=>q.rows.some(r=>r.cat===k)).forEach(k=>{
    addRow(`<td colspan="6">${esc(k)}</td>`,"cat");
    q.rows.filter(r=>r.cat===k).forEach(r=>addRow(`<td><div>${esc(r.name)}</div>${r.desc?`<div class="d">${esc(r.desc)}</div>`:""}</td><td class="n">${esc(r.qty)}</td><td>${esc(r.unit)}</td><td class="n">${won(r.price)}</td><td class="n">${won((Number(r.qty)||0)*(Number(r.price)||0))}</td><td class="d">${esc(r.note)}</td>`));
    addRow(`<td colspan="4" class="n">${esc(k)} 소계</td><td class="n">${won(c.subs[k])}</td><td></td>`,"sub")});
  tbody=null;
  add(el("div","s-tot",`<div>항목 합계</div><div>${won(c.sub)}</div>${c.disc?`<div>할인·조정</div><div>${c.disc>0?"−":"+"}${won(Math.abs(c.disc))}</div>`:""}<div>공급가액</div><div>${won(c.supply)}</div><div>부가세${q.vatMode==="none"?" (미적용)":" ("+esc(q.vatRate)+"%)"}</div><div>${won(c.vat)}</div><div class="g">최종 합계</div><div class="g">₩ ${won(c.total)}</div>`));
  const terms=TERMS.filter(([k])=>(q.terms[k]||"").trim());
  if(terms.length){add(el("div","s-terms",`<h3>작업 조건 및 특이사항</h3>`));terms.forEach(([k,l])=>add(el("div","s-term",`<b>${esc(l)}</b><div>${esc(q.terms[k])}</div>`)))}
  const mark=el("div","s-mark",'<img src="data:image/png;base64,'+LOGO+'" alt="DEKHE" style="display:block;width:420px;max-width:100%;height:auto">');

      host.innerHTML="";const name=["견적서",q.client.name,q.date].filter(Boolean).join("_").replace(/[\\/:*?"<>|]/g,"")+".pdf";
      if(await saveFile(name,pdf.output("blob")))toast("PDF를 저장했습니다")}
    catch(err){toast("PDF를 만들지 못했습니다")}
    b.disabled=false;b.textContent="A4 PDF 받기"};
}
route();
})();
</script>
